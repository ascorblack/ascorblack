<svg xmlns="http://www.w3.org/2000/svg" width="420" height="560" viewBox="0 0 420 560">
  <defs>
    <pattern id="checker" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#e7ddd0"/>
      <rect x="0" y="0" width="3" height="3" fill="#1c1714" opacity="0.6"/>
      <rect x="3" y="3" width="3" height="3" fill="#1c1714" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Card background -->
  <rect x="0" y="0" width="420" height="560" rx="12" fill="#1c1714"/>
  <!-- Border -->
  <rect x="8" y="8" width="404" height="544" rx="8" fill="none" stroke="#88d787" stroke-width="2"/>

  <!-- Header -->
  <text x="24" y="42" font-family="'Courier New',monospace" font-size="17" font-weight="bold" fill="#88d787" stroke="#88d787" stroke-width="0.5">★★  UNCOMMON</text>
  <text x="296" y="42" font-family="'Courier New',monospace" font-size="17" font-weight="bold" fill="#88d787" stroke="#88d787" stroke-width="0.5">MUSHROOM</text>

  <!-- ASCII art mushroom — monospace-aligned, centered -->
  <text x="80" y="82" font-family="'Courier New',monospace" font-size="22" fill="#88d787" stroke="#88d787" stroke-width="0.7" xml:space="preserve">   ─┼─</text>
  <text x="80" y="108" font-family="'Courier New',monospace" font-size="22" fill="#88d787" stroke="#88d787" stroke-width="0.7" xml:space="preserve"> .─o─00─o─.</text>
  <text x="80" y="134" font-family="'Courier New',monospace" font-size="22" fill="#88d787" stroke="#88d787" stroke-width="0.7" xml:space="preserve">(____________)</text>
  <text x="80" y="160" font-family="'Courier New',monospace" font-size="22" fill="#88d787" stroke="#88d787" stroke-width="0.7" xml:space="preserve">   │:    :│</text>
  <text x="80" y="186" font-family="'Courier New',monospace" font-size="22" fill="#88d787" stroke="#88d787" stroke-width="0.7" xml:space="preserve">   │______│</text>

  <!-- Name -->
  <text x="24" y="226" font-family="'Courier New',monospace" font-size="18" font-weight="bold" fill="#e7ddd0">Snafu</text>

  <!-- Description -->
  <text x="24" y="256" font-family="'Courier New',monospace" font-size="13" font-style="italic" fill="#949494">"A hyperactive fungal menace with</text>
  <text x="24" y="274" font-family="'Courier New',monospace" font-size="13" font-style="italic" fill="#949494">a hair-trigger snark response and</text>
  <text x="24" y="292" font-family="'Courier New',monospace" font-size="13" font-style="italic" fill="#949494">zero patience for sloppy</text>
  <text x="24" y="310" font-family="'Courier New',monospace" font-size="13" font-style="italic" fill="#949494">logic—will absolutely roast your</text>
  <text x="24" y="328" font-family="'Courier New',monospace" font-size="13" font-style="italic" fill="#949494">off-by-one errors while</text>
  <text x="24" y="346" font-family="'Courier New',monospace" font-size="13" font-style="italic" fill="#949494">simultaneously knocking over your</text>
  <text x="24" y="364" font-family="'Courier New',monospace" font-size="13" font-style="italic" fill="#949494">coffee with chaotic enthusiasm."</text>

  <!-- Stats — 28px apart, starting at y=406 -->
  <!-- DEBUGGING 52 -->
  <text x="24" y="406" font-family="'Courier New',monospace" font-size="14" font-weight="bold" fill="#e7ddd0">DEBUGGING</text>
  <rect x="150" y="393" width="180" height="16" rx="2" fill="#333028"/>
  <rect x="150" y="393" width="94" height="16" rx="2" fill="url(#checker)"/>
  <text x="340" y="406" font-family="'Courier New',monospace" font-size="14" fill="#e7ddd0">52</text>

  <!-- PATIENCE 17 -->
  <text x="24" y="434" font-family="'Courier New',monospace" font-size="14" font-weight="bold" fill="#e7ddd0">PATIENCE</text>
  <rect x="150" y="421" width="180" height="16" rx="2" fill="#333028"/>
  <rect x="150" y="421" width="31" height="16" rx="2" fill="url(#checker)"/>
  <text x="340" y="434" font-family="'Courier New',monospace" font-size="14" fill="#e7ddd0">17</text>

  <!-- CHAOS 52 -->
  <text x="24" y="462" font-family="'Courier New',monospace" font-size="14" font-weight="bold" fill="#e7ddd0">CHAOS</text>
  <rect x="150" y="449" width="180" height="16" rx="2" fill="#333028"/>
  <rect x="150" y="449" width="94" height="16" rx="2" fill="url(#checker)"/>
  <text x="340" y="462" font-family="'Courier New',monospace" font-size="14" fill="#e7ddd0">52</text>

  <!-- WISDOM 20 -->
  <text x="24" y="490" font-family="'Courier New',monospace" font-size="14" font-weight="bold" fill="#e7ddd0">WISDOM</text>
  <rect x="150" y="477" width="180" height="16" rx="2" fill="#333028"/>
  <rect x="150" y="477" width="36" height="16" rx="2" fill="url(#checker)"/>
  <text x="340" y="490" font-family="'Courier New',monospace" font-size="14" fill="#e7ddd0">20</text>

  <!-- SNARK 67 -->
  <text x="24" y="518" font-family="'Courier New',monospace" font-size="14" font-weight="bold" fill="#e7ddd0">SNARK</text>
  <rect x="150" y="505" width="180" height="16" rx="2" fill="#333028"/>
  <rect x="150" y="505" width="121" height="16" rx="2" fill="url(#checker)"/>
  <text x="340" y="518" font-family="'Courier New',monospace" font-size="14" fill="#e7ddd0">67</text>

</svg>
